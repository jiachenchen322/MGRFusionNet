[project]
version = '3.0'
project_name = 'protein-encoder'
project_out_path = 'results'
tissue_list = ['PRIVATE_PROTEIN_MODALITY']

[GlobalOptions]
fold = 0
n_epochs = 50
support_attn = 0

[model.default]
common_talos_dict = {
    'l1_reg': [0.001],
    'clusters': [80],
    'weightdecay': [0],
    'batchsize': [4],
    }
data_dict = {
    'species':'human',
    'root_prefix1':'path/to/private_metadata_root',
    'data_base_path':'path/to/private_graph_root',
    'graph_file'       : 'your_graph.graphml',
    'gene_syms'        : 'gene_header_with_symbols.csv',
    'nclass': 2,
    }

[data.0]
data_dict = {
    'lnames':['class0','class1'],
    }

[model.0]
struct_dict = {
    'lamb3':0.1,
    'lamb5':0.1,
    'lamb6':3,
    'lamb9':0.0005,
    }
